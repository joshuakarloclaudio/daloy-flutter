# Builds the Windows app (README → Desktop) and uploads the Release folder
# (Daloy.exe with its DLLs and data\, for testing with Smart App Control off)
# and the Microsoft Store package (Daloy.msix, to upload in Partner Center).
#
# Needs the repository secret DALOY_ENV_JSON: the contents of env.local.json
# (git-ignored), passed to the build as --dart-define-from-file. The Store
# package also needs the repository variables MSIX_IDENTITY_NAME,
# MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME (Partner Center → the app →
# Product identity: Package/Identity/Name, Package/Identity/Publisher and
# Package/Properties/PublisherDisplayName).
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, DP-7]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Write env.local.json
        shell: pwsh
        env:
          DALOY_ENV_JSON: ${{ secrets.DALOY_ENV_JSON }}
        run: |
          if (-not $env:DALOY_ENV_JSON) {
            Write-Error "Add the DALOY_ENV_JSON repository secret (the contents of env.local.json)."
            exit 1
          }
          [IO.File]::WriteAllText("env.local.json", $env:DALOY_ENV_JSON)

      - run: flutter pub get

      - run: flutter build windows --release --dart-define-from-file=env.local.json

      # windows/CMakeLists.txt copies the VC++ runtime in, so the app opens
      # without the Redistributable; CMake only warns if it can't find it.
      - name: Check the VC++ runtime shipped
        shell: pwsh
        run: |
          $missing = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') |
            Where-Object { -not (Test-Path "build/windows/x64/runner/Release/$_") }
          if ($missing) {
            Write-Error "Missing from the build: $($missing -join ', ')"
            exit 1
          }
          Get-ChildItem build/windows/x64/runner/Release -Filter *.dll | Select-Object -ExpandProperty Name

      # The Store package (pubspec → msix_config). Its identity comes from
      # Partner Center → Product identity, kept in repository variables;
      # skipped until they're set.
      - name: Package for the Microsoft Store
        if: vars.MSIX_IDENTITY_NAME != ''
        run: >
          dart run msix:create
          --identity-name "${{ vars.MSIX_IDENTITY_NAME }}"
          --publisher "${{ vars.MSIX_PUBLISHER }}"
          --publisher-display-name "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"

      - uses: actions/upload-artifact@v7
        if: vars.MSIX_IDENTITY_NAME != ''
        with:
          name: Daloy-msix-${{ github.sha }}
          path: build/msix/Daloy.msix
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: Daloy-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
